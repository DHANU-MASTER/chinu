# PostgreSQL profile — activated with SPRING_PROFILES_ACTIVE=postgres
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/aiteacher}
spring.datasource.username=${POSTGRES_USERNAME:aiteacher}
spring.datasource.password=${POSTGRES_PASSWORD:aiteacher}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Real RAG: OpenAI-compatible embeddings stored in pgvector.
# Set RAG_EMBEDDINGS=local to fall back to the offline hash embeddings.
# (Environment variable takes precedence over this default.)
RAG_EMBEDDINGS=${RAG_EMBEDDINGS:api}
